<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>See Screen</title>
<style>
    * { box-sizing: border-box; }
    body {
        margin: 0;
        background: #0f1115;
        color: #f4f4f5;
        font-family: Segoe UI, Arial, sans-serif;
    }
    header {
        padding: 22px;
        border-bottom: 1px solid #242832;
        background: #151820;
    }
    h1 { margin: 0 0 14px; }
    .search {
        display: flex;
        gap: 10px;
        max-width: 650px;
    }
    input, button {
        border: 1px solid #343946;
        border-radius: 10px;
        padding: 12px 14px;
        font-size: 16px;
    }
    input {
        flex: 1;
        background: #0e1014;
        color: white;
        text-transform: uppercase;
    }
    button {
        cursor: pointer;
        background: #fff;
        color: #111;
        font-weight: 600;
    }
    #status {
        margin-top: 12px;
        color: #a9adb8;
    }
    main {
        padding: 22px;
        display: grid;
        gap: 20px;
        grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
    }
    .screen {
        background: #171a21;
        border: 1px solid #0e1014;
        border-radius: 14px;
        overflow: hidden;
    }
    .screen h2 {
        margin: 0;
        padding: 12px 16px;
        font-size: 15px;
        color: #c8cbd3;
    }
    .screen img {
        display: block;
        width: 100%;
        height: auto;
        background: black;
    }
    .screen .stage {
        position: relative;
        line-height: 0;
    }
    .screen canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
    }
    .empty {
        padding: 60px 20px;
        text-align: center;
        color: #777d89;
    }
</style>
</head>
<body>
<header>
    <h1>See Screen</h1>
    <div class="search">
        <input id="id" maxlength="14" placeholder="Введите ID устройства">
        <button onclick="connect()">Подключиться</button>
    </div>
    <div id="status">Введите ID, чтобы начать просмотр.</div>
</header>

<main id="screens">
    <div class="empty">Экраны появятся здесь после подключения.</div>
</main>

<script>
let socket = null;
const screens = new Map();

function setStatus(text) {
    document.getElementById("status").textContent = text;
}

function drawCursor(state) {
    const { img, canvas, latest } = state;
    const nw = img.naturalWidth;
    const nh = img.naturalHeight;
    if (!nw || !nh || !latest) return;

    if (canvas.width !== nw) canvas.width = nw;
    if (canvas.height !== nh) canvas.height = nh;

    const ctx = canvas.getContext("2d");
    ctx.clearRect(0, 0, nw, nh);

    const mx = latest.mouse_x;
    const my = latest.mouse_y;
    if (mx == null || my == null) return;

    const sx = nw / latest.width;
    const sy = nh / latest.height;
    const cx = mx * sx;
    const cy = my * sy;

    // Классический указатель мыши (стрелка) со сглаженными углами.
    // Размер подобран относительно ширины кадра в пикселях canvas.
    const k = Math.max(1, nw / 720) * 0.67;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(k, k);

    // Контур стрелки (в единицах рисунка) со скруглёнными углами.
    const pts = [
        [0, 0], [0, 16], [4, 12], [7, 18], [9, 17], [6, 11], [12, 11]
    ];
    const r = 1.6; // радиус скругления углов
    const len = pts.length;
    ctx.beginPath();
    for (let i = 0; i < len; i++) {
        const [x0, y0] = pts[(i - 1 + len) % len];
        const [x1, y1] = pts[i];
        const [x2, y2] = pts[(i + 1) % len];
        const d1 = Math.hypot(x1 - x0, y1 - y0) || 1;
        const d2 = Math.hypot(x2 - x1, y2 - y1) || 1;
        const rr = Math.min(r, d1 / 2, d2 / 2);
        const sx0 = x1 - (x1 - x0) / d1 * rr;
        const sy0 = y1 - (y1 - y0) / d1 * rr;
        const ex0 = x1 + (x2 - x1) / d2 * rr;
        const ey0 = y1 + (y2 - y1) / d2 * rr;
        if (i === 0) ctx.moveTo(sx0, sy0);
        else ctx.lineTo(sx0, sy0);
        ctx.arcTo(x1, y1, ex0, ey0, rr);
    }
    ctx.closePath();

    ctx.fillStyle = "#c8c8c8";
    ctx.strokeStyle = "#6e6e6e";
    ctx.lineWidth = 1.2 / k;
    ctx.lineJoin = "round";
    ctx.fill();
    ctx.stroke();
    ctx.restore();
}

function connect() {
    const id = document.getElementById("id").value.trim().toUpperCase();
    if (!id) return;

    if (socket) {
        socket.close();
        socket = null;
    }

    screens.clear();
    document.getElementById("screens").innerHTML =
        '<div class="empty">Подключение...</div>';

    const protocol = location.protocol === "https:" ? "wss:" : "ws:";
    socket = new WebSocket(
        `${protocol}//${location.host}/ws/viewer/${encodeURIComponent(id)}`
    );

    socket.onopen = () => {
        setStatus("Подключено. Ожидание изображения...");
        socket.send("viewer");
    };

    socket.onmessage = (event) => {
        const data = JSON.parse(event.data);
        if (data.type !== "frame") return;

        let card = screens.get(data.monitor);

        if (!card) {
            if (screens.size === 0) {
                document.getElementById("screens").innerHTML = "";
            }

            card = document.createElement("section");
            card.className = "screen";

            const title = document.createElement("h2");
            title.textContent = `Экран ${data.monitor}`;

            const stage = document.createElement("div");
            stage.className = "stage";

            const img = document.createElement("img");
            img.alt = `Экран ${data.monitor}`;

            const canvas = document.createElement("canvas");

            stage.appendChild(img);
            stage.appendChild(canvas);
            card.appendChild(title);
            card.appendChild(stage);
            document.getElementById("screens").appendChild(card);

            img.onload = () => drawCursor(state);
            screens.set(data.monitor, { card, img, canvas, latest: null });
        }

        const state = screens.get(data.monitor);
        state.latest = data;
        state.img.src = "data:image/jpeg;base64," + data.image;

        setStatus(`Передача активна • экранов: ${screens.size}`);
    };

    socket.onerror = () => {
        setStatus("Ошибка подключения.");
    };

    socket.onclose = () => {
        setStatus("Соединение закрыто.");
    };
}

document.getElementById("id").addEventListener("keydown", e => {
    if (e.key === "Enter") connect();
});
</script>
</body>
</html>
